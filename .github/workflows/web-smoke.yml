# Surface smoke (handbook §2, backlog A9): builds the production bundle and
# asserts in a real browser that Home renders the map VISIBLY (nonzero size,
# visible pins, clean console). Exists because #310–#314 passed every other
# gate while operators saw a 0-pixel black box — only a browser looking at
# pixels catches that class. Runs against `vite preview` (the BUILT app):
# the CSS-order collapse only manifests in production bundles, never dev.
#
# Dormant-until-secrets (repo convention): skips with a warning when the
# SMOKE_USER_* / VITE_SUPABASE_* secrets are absent, never blocks a merge.

name: Web smoke

on:
  pull_request:
    paths:
      - 'apps/web/**'
      - 'packages/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/web-smoke.yml'
  push:
    branches: [main]
    paths:
      - 'apps/web/**'
      - 'packages/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/web-smoke.yml'
  workflow_dispatch:

concurrency:
  group: web-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: home renders the map
    runs-on: ubuntu-latest
    env:
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
      SMOKE_USER_EMAIL: ${{ secrets.SMOKE_USER_EMAIL }}
      SMOKE_USER_PASSWORD: ${{ secrets.SMOKE_USER_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Gate on secrets
        id: gate
        run: |
          if [ -z "$VITE_SUPABASE_URL" ] || [ -z "$SMOKE_USER_EMAIL" ]; then
            echo "::warning::smoke secrets not set (VITE_SUPABASE_URL / VITE_SUPABASE_PUBLISHABLE_KEY / SMOKE_USER_EMAIL / SMOKE_USER_PASSWORD) — skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: pnpm/action-setup@v4
        if: steps.gate.outputs.skip != 'true'
        with:
          version: 10.33.2

      - uses: actions/setup-node@v4
        if: steps.gate.outputs.skip != 'true'
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile
        if: steps.gate.outputs.skip != 'true'

      - run: pnpm --filter @beacon/web exec playwright install chromium --with-deps
        if: steps.gate.outputs.skip != 'true'

      - run: pnpm --filter @beacon/web build
        if: steps.gate.outputs.skip != 'true'

      - run: pnpm --filter @beacon/web exec playwright test
        if: steps.gate.outputs.skip != 'true'

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: apps/web/test-results/
          retention-days: 7
