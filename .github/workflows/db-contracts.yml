name: DB contract tests

# Runs the data-layer self-apply guards (supabase/tests/*.sql) against the linked
# project whenever the DB layer changes. Mirrors deploy-edge-functions.yml: it's
# dormant until SUPABASE_DB_URL is set as a repo secret — the step no-ops with a
# warning when it's absent, so it never blocks a merge.
#
# SUPABASE_DB_URL must connect as a role that can SET ROLE anon/authenticated
# (the project's `postgres` connection string, e.g. the Session-pooler URI), so
# rls_contracts.sql can simulate tenants. psql ships on the ubuntu-latest runner.
# A RAISE EXCEPTION in any guard aborts under -v ON_ERROR_STOP=1 → the job fails.

on:
  pull_request:
    paths:
      - 'supabase/migrations/**'
      - 'supabase/tests/**'
      - '.github/workflows/db-contracts.yml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/db-contracts.yml'
  # On main, db-migrate.yml owns the supabase/** paths: it applies pending
  # migrations and then runs these same guards against the result. Triggering
  # both would race the guards against the migration they are meant to check.
  #
  # Daily sweep catches drift introduced outside a PR — e.g. a migration applied
  # directly via the Supabase MCP (which is how the #235 leak landed). Runs after
  # the 07:00 UTC intelligence cron.
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:

concurrency:
  group: db-contracts-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    name: security invariants + RLS contracts
    runs-on: ubuntu-latest
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
    steps:
      - uses: actions/checkout@v4

      - name: Run data-layer contract guards
        run: |
          if [ -z "$SUPABASE_DB_URL" ]; then
            echo "::warning::SUPABASE_DB_URL not set — skipping DB contract tests. Add the repo secret (the project's postgres connection string) to enable."
            exit 0
          fi
          for f in supabase/tests/security_invariants.sql supabase/tests/rls_contracts.sql supabase/tests/ontology_drift.sql; do
            echo "── running $f"
            psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -f "$f"
          done

      # get_advisors gate — fails only on ERROR-level security lints (WARN/INFO
      # are advisory). The SQL guards above are the precise instrument for the
      # tenant-param leak class; this catches the broader catalog (RLS-disabled
      # tables, definer views) the linter sees. Dormant until both secrets are set.
      - name: Security advisors gate (ERROR-level)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF:  ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_PROJECT_REF" ]; then
            echo "::warning::SUPABASE_ACCESS_TOKEN / SUPABASE_PROJECT_REF not set — skipping get_advisors gate. The SQL guards already cover the leak class (anon-exec, search_path, unscoped tenant params)."
            exit 0
          fi
          resp=$(curl -sS -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/advisors/security")
          n=$(echo "$resp" | jq '[.lints[]? | select(.level=="ERROR")] | length')
          echo "ERROR-level security advisors: ${n:-?}"
          if [ "${n:-0}" -gt 0 ]; then
            echo "$resp" | jq -r '.lints[]? | select(.level=="ERROR") | "::error::advisor [" + .name + "] " + .title + " — " + (.detail // "")'
            exit 1
          fi
          echo "No ERROR-level security advisors."
