name: Deploy edge functions

# Auto-deploys ALL Supabase edge functions on merge to main. Discovers the
# function set from supabase/functions/ so the deployed set can't drift from the
# repo. The reality-graph bundle is rebuilt FROM SOURCE first (bundle-dependent
# functions import it), so the deployed code is always correct even if the
# committed artifact drifted.
#
# Dormant until SUPABASE_ACCESS_TOKEN is set as a repo secret — the deploy step
# no-ops with a warning when it's absent, so this never blocks a merge.

on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/**'
      - 'supabase/config.toml'
      - 'packages/reality-graph/src/**'
      - '.github/workflows/deploy-edge-functions.yml'

concurrency:
  group: deploy-edge-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    name: regenerate bundle + deploy
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: nohsofkkuypwlvdsfbnw
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Rebuild the edge bundle from reality-graph source — the single source of
      # truth. It's git-ignored (generated, never committed) so it can't drift.
      - name: Build reality-graph edge bundle
        run: pnpm build:edge-bundle

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      # Deploy EVERY function in supabase/functions/ — discovered from the
      # filesystem so the deployed set can't drift from the repo (the gap that
      # left agent-llm, invite-member, parse-invoice, and the integration
      # webhooks undeployed while the app called them). JWT policy per function
      # lives in supabase/config.toml (verify_jwt), so the deploy never
      # hand-passes a flag and a new function can't ship with the wrong default.
      # A new function needs zero workflow changes — just add a [functions.<slug>]
      # block in config.toml if it must be reachable without a user JWT.
      - name: Deploy all edge functions
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::warning::SUPABASE_ACCESS_TOKEN not set — skipping edge deploy. Add the repo secret to enable."
            exit 0
          fi
          for dir in supabase/functions/*/; do
            fn=$(basename "$dir")
            [ "$fn" = "_shared" ] && continue
            echo "::group::deploy $fn"
            supabase functions deploy "$fn" --project-ref "$PROJECT_REF"
            echo "::endgroup::"
          done
