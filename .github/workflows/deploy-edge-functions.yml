name: Deploy edge functions

# Auto-deploys the bundle-dependent Supabase edge functions on merge to main.
# Removes the recurring manual step (regen the 692KB reality-graph bundle by
# hand, then `supabase functions deploy`) that blocked shipping the calibration
# pillar. The bundle is rebuilt FROM SOURCE here, so the deployed code is always
# correct even if the committed artifact drifted.
#
# Dormant until SUPABASE_ACCESS_TOKEN is set as a repo secret — the deploy step
# no-ops with a warning when it's absent, so this never blocks a merge.

on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/**'
      - 'packages/reality-graph/src/**'
      - '.github/workflows/deploy-edge-functions.yml'

concurrency:
  group: deploy-edge-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    name: regenerate bundle + deploy
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: nohsofkkuypwlvdsfbnw
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Rebuild the edge bundle from reality-graph source — the single source of
      # truth. It's git-ignored (generated, never committed) so it can't drift.
      - name: Build reality-graph edge bundle
        run: pnpm build:edge-bundle

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      # Per-function deploy with explicit verify_jwt flags. intelligence-cycle is
      # cron-only (x-beacon-secret, no JWT); the others require a user JWT.
      - name: Deploy bundle-dependent functions
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::warning::SUPABASE_ACCESS_TOKEN not set — skipping edge deploy. Add the repo secret to enable."
            exit 0
          fi
          supabase functions deploy copilot-chat        --project-ref "$PROJECT_REF"
          supabase functions deploy scenario-simulate   --project-ref "$PROJECT_REF"
          supabase functions deploy intelligence-cycle  --project-ref "$PROJECT_REF" --no-verify-jwt
