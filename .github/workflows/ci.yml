name: CI

on:
  pull_request:
  push:
    branches: [main]
  # Manual trigger: a run blocked by billing can't be queued for later, so this
  # is how main gets a real verification pass once minutes are available again.
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: lint + type-check + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm turbo lint type-check test

      # An RPC name is a STRING handed to
      # PostgREST, so a function that does not exist type-checks perfectly and
      # fails at runtime. Four were missing when this was written — occupancy
      # ingestion had never worked.
      - name: Every called RPC exists
        run: pnpm check:rpcs

      # Five guards policed the database and none looked at apps/web. A cleanup
      # deleted ReportsPage and left its eleven sections behind, plus FinancePage
      # whose route had become a redirect — 2,503 lines surviving the very sweep
      # meant to find them. This walks the import graph from main.tsx.
      - name: Every web file is reachable
        run: pnpm check:surfaces

