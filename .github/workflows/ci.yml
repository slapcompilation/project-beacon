name: CI

on:
  pull_request:
  push:
    branches: [main]
  # Manual trigger: a run blocked by billing can't be queued for later, so this
  # is how main gets a real verification pass once minutes are available again.
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: lint + type-check + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm turbo lint type-check test

      # A plausible quote reads exactly like a real one, and CLAUDE.md's
      # founding failure was an invented citation. The mirror is on disk, so
      # this is mechanical rather than a matter of review.
      - name: Every citation traces to a mirrored page
        run: pnpm check:readings

      # Five guards policed the database and none looked at apps/web. A cleanup
      # deleted ReportsPage and left its eleven sections behind, plus FinancePage
      # whose route had become a redirect — 2,503 lines surviving the very sweep
      # meant to find them. This walks the import graph from main.tsx.
      - name: Every web file is reachable
        run: pnpm check:surfaces

      # turbo covers the TS packages but not supabase/functions (Deno, resolved
      # at deploy). This guard was deleted in the teardown when that directory
      # was empty; function-run put real code back. It parses every file and
      # proves each one is statically imported — the deploy uploads only what
      # index.ts reaches, so a runtime-only reference ships an empty module and
      # fails when it is called, not when it is deployed.
      - name: Edge functions parse, and deploy whole
        run: pnpm check:edge
