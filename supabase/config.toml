# Minimal Supabase config — the source of truth for per-function JWT policy.
#
# `supabase functions deploy <slug>` reads verify_jwt from here, so deploys (CI
# and manual) can't drift or hand-pass the wrong `--no-verify-jwt` flag. This is
# what makes the edge-deploy workflow robust: a new function gets the secure
# default (verify_jwt = true) unless it's deliberately declared public below.
#
# Only the deliberately PUBLIC functions are listed — anything omitted requires a
# user JWT. Keep this in sync when a function must be reachable without one.
# (Intentionally minimal: this declares JWT policy only, not local-dev settings.)
#
# ── THE LIST IS EMPTY, AND THAT IS CORRECT ──────────────────────────────────
# It declared six: intelligence-cycle, eval-record, ingest-pos,
# ingest-occupancy, square-webhook and mews-webhook. All six were the
# hospitality product's, and their code went in the teardown; none of the four
# functions that exist today wants verify_jwt = false. So every entry named a
# function that was not there.
#
# That was invisible until edge-deploy.yml ran for the first time and the CLI
# tried to bundle a directory that does not exist:
#
#   WARN: failed to read file: open supabase/functions/eval-record/index.ts
#   Error: entrypoint path does not exist (.../supabase/functions/eval-record/index.ts)
#
# `pnpm check:edge` now asks the question directly, so the next stale entry
# fails on a pull request instead of a deploy. NOTE: removing an entry here
# does not undeploy anything — if those six are still live in the project they
# have to be deleted there, which is the operator's call, not a migration's.

